# DevSecOps pipeline:
#   1. Secret scan (gitleaks)      ┐
#   2. SAST (Semgrep)              ├─ run in parallel
#   3. Tests + SCA (npm audit)     ┘
#   4. Build image + Trivy scan (dependencies, Dockerfile misconfig, image CVEs)
#   5. DAST (OWASP ZAP baseline against the running container)
#   6. Publish image to GHCR (only on push to main, only if everything passed)

name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: devsecops-notes
  # Pin scanner versions. Update them on purpose, after checking the release notes.
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2
  SEMGREP_IMAGE: semgrep/semgrep:1.99.0
  TRIVY_IMAGE: aquasec/trivy:0.58.1
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable

jobs:
  # ------------------------------------------------------------------ 1
  secrets-scan:
    name: 1. Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so secrets in old commits are found too

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --source /repo --redact --verbose \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Upload results to GitHub Security tab
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ------------------------------------------------------------------ 2
  sast:
    name: 2. SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep full report (all severities)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/javascript --config p/owasp-top-ten \
            --sarif --output semgrep.sarif

      - name: Upload results to GitHub Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Security gate - fail on ERROR severity findings
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/javascript --config p/owasp-top-ten \
            --severity ERROR --error

  # ------------------------------------------------------------------ 3
  test:
    name: 3. Unit tests + dependency audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: npm audit (fail on high/critical in production deps)
        run: npm audit --omit=dev --audit-level=high

  # ------------------------------------------------------------------ 4
  build-and-scan:
    name: 4. Build image + Trivy scan
    needs: [secrets-scan, sast, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Trivy filesystem scan (deps, Dockerfile misconfig, secrets)
        run: |
          docker run --rm -v "$PWD:/src" -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs /src \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /src/.trivyignore \
            --exit-code 1

      - name: Trivy image scan (SARIF report)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/src" -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image "$IMAGE_NAME:${{ github.sha }}" \
            --ignorefile /src/.trivyignore \
            --format sarif --output /src/trivy-image.sarif

      - name: Upload image results to GitHub Security tab
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Security gate - fail on HIGH/CRITICAL image CVEs
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/src" -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image "$IMAGE_NAME:${{ github.sha }}" \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /src/.trivyignore \
            --exit-code 1

      - name: Save image for next jobs
        run: docker save "$IMAGE_NAME:${{ github.sha }}" | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  # ------------------------------------------------------------------ 5
  dast:
    name: 5. DAST (OWASP ZAP baseline)
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Start the app container
        run: |
          gunzip -c image.tar.gz | docker load
          docker run -d --name app -p 3000:3000 "$IMAGE_NAME:${{ github.sha }}"

      - name: Wait until the app is healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000/health; then echo; echo "App is up"; exit 0; fi
            sleep 1
          done
          echo "App did not start"; docker logs app; exit 1

      - name: Run ZAP baseline scan
        run: |
          chmod a+w .zap
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://localhost:3000 \
            -c rules.tsv -r zap-report.html -J zap-report.json -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            .zap/zap-report.html
            .zap/zap-report.json

      - name: App logs (on failure)
        if: failure()
        run: docker logs app

  # ------------------------------------------------------------------ 6
  publish:
    name: 6. Publish image to GHCR
    needs: dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          gunzip -c image.tar.gz | docker load
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TARGET="ghcr.io/$OWNER/$IMAGE_NAME"
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$TARGET:${{ github.sha }}"
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$TARGET:latest"
          docker push "$TARGET:${{ github.sha }}"
          docker push "$TARGET:latest"
          echo "Published $TARGET:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
